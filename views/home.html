<div class="home-fullscreen">
    <h1 class="portfolio-header">
        <span class="highlight-pink">Nandini Chaganti Portfolio</span>
    </h1>
    <div class="roles-container">
        <span class="intro-text">I'm a </span>
        <span id="role-text" class="role-text highlight-pink"></span>
    </div>

    <div class="showcase-text">
        I design and build full-stack web applications using modern JavaScript and cloud technologies to deliver reliable, user-focused products.
    </div>

    <a href="#projects" class="cta-btn-pink discover-btn">Discover More</a>
</div>

<script>
const roles = [
    "Software Engineer",
    "Backend Engineer",
    "Forward Deployed Engineer",
    "GraphRAG Engineer"
];

let roleIndex = 0;
let charIndex = 0;
const roleText = document.getElementById("role-text");

function typeRole() {
    const current = roles[roleIndex];
    if (charIndex < current.length) {
        roleText.textContent += current[charIndex];
        charIndex++;
        setTimeout(typeRole, 90);
    } else {
        setTimeout(eraseRole, 1200);
    }
}

function eraseRole() {
    if (charIndex > 0) {
        roleText.textContent = roles[roleIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(eraseRole, 40);
    } else {
        roleIndex = (roleIndex + 1) % roles.length;
        setTimeout(typeRole, 400);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    roleText.textContent = "";
    typeRole();
});
</script>
